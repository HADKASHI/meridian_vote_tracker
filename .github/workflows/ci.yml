name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Build (warnings are errors)
        run: dotnet build Meridian.slnx -warnaserror
      - name: OpenAPI contract matches the code
        run: git diff --exit-code -- contracts/openapi.json
      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/Meridian.Data --no-build
      - name: Domain and integration tests (PostgreSQL and Azurite in Testcontainers)
        run: dotnet test --solution Meridian.slnx --no-build -- --filter-not-trait "Category=RealData" --filter-not-trait "Category=Performance"

  integration-postgres-17:
    # ADR 0009: a managed server on 17 runs the app, so the whole integration suite proves it.
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: postgres:17
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build Meridian.slnx -warnaserror
      - name: Integration tests on PostgreSQL 17 (Testcontainers)
        run: dotnet test --project tests/Meridian.Integration.Tests --no-build -- --filter-not-trait "Category=RealData" --filter-not-trait "Category=Performance"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ./tests/data
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - name: The Azure override merges, and starts neither the local database nor Azurite
        env:
          AZURE_POSTGRES_CONNECTION_STRING: Host=server.postgres.database.azure.com;Database=meridian;Username=u;Password=p;SSL Mode=Require
          BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=https;AccountName=a;AccountKey=Zm9v;EndpointSuffix=core.windows.net
        run: |
          docker compose -f compose.yaml -f compose.azure.yaml config --services | sort > azure-services.txt
          test "$(cat azure-services.txt | tr '\n' ' ')" = "api migrate web worker "
      - name: Start the stack with the synthetic member states
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: migrate exited 0
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
      - name: The app and an authenticated API call answer through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<app-root>'
          curl -fsS -H 'X-User-Id: dana' http://127.0.0.1:8080/api/status | grep -q '"pendingConflicts"'
          curl -fsS http://127.0.0.1:8080/api/users | grep -q '"lena"'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser smoke test (switch user, upload, report, decision race in two tabs)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
