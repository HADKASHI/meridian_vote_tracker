# Run against Azure Blob Storage and Azure Database for PostgreSQL (ADR 0009, docs/azure.md):
#   docker compose -f compose.yaml -f compose.azure.yaml up --build
# Needs AZURE_POSTGRES_CONNECTION_STRING and one of BLOB_SERVICE_URI (Entra ID sign-in) or BLOB_CONNECTION_STRING (key) in .env.
# A Blob service address (and a Document Intelligence endpoint with no key) sign in with Microsoft Entra ID: a container has no
# `az login`, so give it a service principal (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET) or see docs/azure.md
# for running the services on the host. Plain `docker compose up` never reads this file.
# The database should be empty or already migrated, and dedicated to this app: migrate applies the migrations to it.

x-azure-env: &azure-env
  ConnectionStrings__Meridian: ${AZURE_POSTGRES_CONNECTION_STRING:?Set AZURE_POSTGRES_CONNECTION_STRING in .env (Npgsql format, with Password and SSL Mode=Require)}
  # Replaces Azurite's connection string from compose.yaml; a service address, when set, wins over a connection string.
  Blob__ConnectionString: ${BLOB_CONNECTION_STRING:-}
  Blob__ServiceUri: ${BLOB_SERVICE_URI:-}
  # Read by DefaultAzureCredential when a service principal is used. No value here passes the one from .env or the shell
  # through, and leaves the variable out of the container when it is not set (an empty one could be mistaken for an id).
  AZURE_TENANT_ID:
  AZURE_CLIENT_ID:
  AZURE_CLIENT_SECRET:
  # TLS to the database is required, and each service names a connection that fails when it starts.
  Database__RequireTls: "true"
  Startup__CheckConnections: "true"

services:
  # The local database and emulator are not started; Azure replaces them.
  db:
    profiles: [local]
  azurite:
    profiles: [local]

  migrate:
    environment: *azure-env
    # Checks both connections first, so a wrong string is named in a line of its own instead of a stack trace
    # from the migration bundle; the check exits 1 when one fails, and the bundle does not run.
    entrypoint: ["/bin/sh", "-c", "Startup__CheckOnly=true dotnet /app/api/Meridian.Api.dll && exec /app/migrate/efbundle"]
    depends_on: !reset {}

  api:
    environment: *azure-env
    depends_on: !override
      migrate: { condition: service_completed_successfully }

  worker:
    environment:
      <<: *azure-env
      DocumentIntelligence__Endpoint: ${DOCINTEL_ENDPOINT:-}
      DocumentIntelligence__Key: ${DOCINTEL_KEY:-} # empty with an endpoint set: sign in with Entra ID
    depends_on: !override
      migrate: { condition: service_completed_successfully }
