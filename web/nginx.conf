# Serves the SPA and proxies /api/ to the API on the same origin, so there is no CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080;            # no trailing slash: the /api prefix is kept
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 200m;             # Imports:MaxUploadBytes
    proxy_request_buffering off;           # stream uploads; the API hashes them on the way to Blob
    proxy_read_timeout 300s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Hashed build output never changes under the same name.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
