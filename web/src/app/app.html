<mat-toolbar class="header">
  <a class="brand" routerLink="/review">Meridian Vote Tracker</a>
  <nav>
    <a mat-button routerLink="/review" routerLinkActive="active">
      <span [matBadge]="shell.pendingConflicts()" [matBadgeHidden]="shell.pendingConflicts() === 0"
        matBadgeOverlap="false" aria-label="Review" data-testid="review-badge">Review</span>
    </a>
    <a mat-button routerLink="/imports" routerLinkActive="active">Imports</a>
    <a mat-button routerLink="/votes" routerLinkActive="active">Votes</a>
    <a mat-button routerLink="/positions" routerLinkActive="active">Positions</a>
    <a mat-button routerLink="/snapshots" routerLinkActive="active">Snapshots</a>
    <a mat-button routerLink="/publications" routerLinkActive="active">Publications</a>
  </nav>
  <span class="spacer"></span>
  <app-jobs-indicator />
  <app-user-switcher />
</mat-toolbar>
<main>
  <router-outlet />
</main>
